<svg xmlns="http://www.w3.org/2000/svg" width="480" height="196" viewBox="0 0 480 196" role="img" aria-label="Four booleans allow 16 combinations, most of them impossible; one status value allows only the 4 real states">
<title>Four booleans allow 16 combinations, most of them impossible; one status value allows only the 4 real states</title>
<style>
text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 12.5px; fill: #c0caf5; }
.m { fill: #8089b3; } .s { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; }
* { transform-box: fill-box; }
@keyframes show { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
.f0 { animation: show 8s steps(1) infinite; animation-delay: -8s; opacity: 0; }
.f1 { animation: show 8s steps(1) infinite; animation-delay: -6s; opacity: 1; }
.f2 { animation: show 8s steps(1) infinite; animation-delay: -4s; opacity: 0; }
.f3 { animation: show 8s steps(1) infinite; animation-delay: -2s; opacity: 0; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x=".5" y=".5" width="479" height="195" rx="10" fill="#1f2335" stroke="#2f3449"/>

<text class="s m" x="24" y="30">before: 4 booleans = 16 combos</text>
<text class="s m" x="290" y="30">after: 1 status = 4 states</text>
<line x1="240" y1="44" x2="240" y2="176" stroke="#2f3449"/>
<text x="24" y="64">isLoading</text><text class="f0" x="186" y="64" text-anchor="end" style="fill:#9ece6a">true</text><text class="f1" x="186" y="64" text-anchor="end" style="fill:#9ece6a">true</text><text class="f2" x="186" y="64" text-anchor="end" style="fill:#8089b3">false</text><text class="f3" x="186" y="64" text-anchor="end" style="fill:#8089b3">false</text><text x="24" y="86">isError</text><text class="f0" x="186" y="86" text-anchor="end" style="fill:#8089b3">false</text><text class="f1" x="186" y="86" text-anchor="end" style="fill:#9ece6a">true</text><text class="f2" x="186" y="86" text-anchor="end" style="fill:#8089b3">false</text><text class="f3" x="186" y="86" text-anchor="end" style="fill:#9ece6a">true</text><text x="24" y="108">hasData</text><text class="f0" x="186" y="108" text-anchor="end" style="fill:#8089b3">false</text><text class="f1" x="186" y="108" text-anchor="end" style="fill:#9ece6a">true</text><text class="f2" x="186" y="108" text-anchor="end" style="fill:#9ece6a">true</text><text class="f3" x="186" y="108" text-anchor="end" style="fill:#9ece6a">true</text><text x="24" y="130">isRetrying</text><text class="f0" x="186" y="130" text-anchor="end" style="fill:#8089b3">false</text><text class="f1" x="186" y="130" text-anchor="end" style="fill:#8089b3">false</text><text class="f2" x="186" y="130" text-anchor="end" style="fill:#8089b3">false</text><text class="f3" x="186" y="130" text-anchor="end" style="fill:#9ece6a">true</text><text class="f0 s" x="105" y="170" text-anchor="middle" style="fill:#9ece6a">✓ valid</text><text class="f1 s" x="105" y="170" text-anchor="middle" style="fill:#f7768e">✗ impossible state, still allowed</text><text class="f2 s" x="105" y="170" text-anchor="middle" style="fill:#9ece6a">✓ valid</text><text class="f3 s" x="105" y="170" text-anchor="middle" style="fill:#f7768e">✗ impossible state, still allowed</text><g class="f0"><rect x="290" y="72" width="164" height="34" rx="17" fill="#8089b3" opacity=".16"/><rect x="290.5" y="72.5" width="163" height="33" rx="16.5" fill="none" stroke="#8089b3"/><text x="372" y="94" text-anchor="middle">status: <tspan style="fill:#8089b3">'idle'</tspan></text></g><g class="f1"><rect x="290" y="72" width="164" height="34" rx="17" fill="#7aa2f7" opacity=".16"/><rect x="290.5" y="72.5" width="163" height="33" rx="16.5" fill="none" stroke="#7aa2f7"/><text x="372" y="94" text-anchor="middle">status: <tspan style="fill:#7aa2f7">'loading'</tspan></text></g><g class="f2"><rect x="290" y="72" width="164" height="34" rx="17" fill="#9ece6a" opacity=".16"/><rect x="290.5" y="72.5" width="163" height="33" rx="16.5" fill="none" stroke="#9ece6a"/><text x="372" y="94" text-anchor="middle">status: <tspan style="fill:#9ece6a">'done'</tspan></text></g><g class="f3"><rect x="290" y="72" width="164" height="34" rx="17" fill="#f7768e" opacity=".16"/><rect x="290.5" y="72.5" width="163" height="33" rx="16.5" fill="none" stroke="#f7768e"/><text x="372" y="94" text-anchor="middle">status: <tspan style="fill:#f7768e">'error'</tspan></text></g>
<text class="s m" x="372" y="140" text-anchor="middle">every value is a real state</text>
</svg>
